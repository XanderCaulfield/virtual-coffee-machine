name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build

  publish:
    name: Publish Api (artifact)
    # Only produce a deployable artifact on pushes to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish Api
        run: dotnet publish src/CoffeeMachine.Api --configuration Release --output publish

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: coffee-machine-api
          path: publish/

  # ============================================================================
  # RENDER DEPLOY (OWNER: A5 / DevOps & Hosting)
  # ----------------------------------------------------------------------------
  # Render's autoDeploy (render.yaml) already redeploys on every push to
  # `main`, so this hook is belt-and-braces: it fires an explicit Render
  # Deploy Hook URL for good measure. The whole job no-ops when the secret
  # is absent, so forks and PR workflows keep passing with Render unwired.
  # To enable: Render dashboard → service → Settings → Deploy Hook → copy the
  # URL into the repo secret RENDER_DEPLOY_HOOK_URL.
  # ============================================================================
  deploy:
    name: Notify Render (deploy hook)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_HOOK != ''
        run: curl -fsS -X POST "$RENDER_HOOK"

      - name: Render hook not configured (autoDeploy covers it)
        if: env.RENDER_HOOK == ''
        run: echo "RENDER_DEPLOY_HOOK_URL secret not set — relying on Render autoDeploy."
